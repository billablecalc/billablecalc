<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Invoice Generator | BillableCalc</title><meta name="description" content="Create a clean invoice and save it as PDF. No sign-up, nothing stored on a server."><link rel="canonical" href="https://billablecalc.com/invoice-generator.html"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--ac:#0b6e4f;--bd:#ddd;--card:#f6f8f7}
@media(prefers-color-scheme:dark){:root{--bg:#141716;--fg:#eee;--mut:#9aa;--ac:#3ecf9a;--bd:#333;--card:#1d2321}}
*{box-sizing:border-box}body{margin:0;font:17px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header,main,footer{max-width:760px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--bd)}
a{color:var(--ac)}h1{line-height:1.2}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:16px 0}
label{display:block;margin:10px 0 4px;font-weight:600}input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
button,.btn{background:var(--ac);color:#fff;border:0;padding:10px 18px;border-radius:6px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;margin-top:12px}
.out{font-size:1.3em;font-weight:700;margin-top:12px}.ad{min-height:90px;margin:16px 0}footer{color:var(--mut);font-size:.9em}
header{align-items:center}header nav a{margin-left:16px;text-decoration:none;font-weight:600}header nav a:hover{text-decoration:underline}
main.wide,body.w header,body.w footer{max-width:980px}.hero{padding:40px 0 24px;text-align:center}.hero h1{font-size:2.3em;margin:0 0 12px}.hero p{font-size:1.15em;color:var(--mut);max-width:620px;margin:0 auto 20px}
.hero .btn{margin:6px}.btn.alt{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.trust{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;color:var(--mut);font-size:.95em;margin:18px 0 0;padding:0;list-style:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:14px 0}.grid .card{margin:0}
.grid .card h3{margin:0 0 6px;font-size:1.05em}.grid .card h3 a{text-decoration:none}.grid .card p{margin:0;color:var(--mut);font-size:.95em}
.grid .card:hover{border-color:var(--ac)}.sec{margin:44px 0 8px}.sec h2{margin:0 0 4px}.sec>p{margin:0;color:var(--mut)}
.promo{background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:26px;margin:44px 0;display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.promo>div{flex:1 1 320px}.promo h2{margin:0 0 8px}.promo ul{padding-left:20px;margin:10px 0}.price{font-size:2em;font-weight:800}
.links{columns:2;column-gap:28px;padding-left:18px}.links li{margin:6px 0;break-inside:avoid}
details{border-bottom:1px solid var(--bd);padding:12px 0}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0;color:var(--mut)}
@media(max-width:600px){.links{columns:1}.hero h1{font-size:1.8em}}
@media(max-width:600px){header nav a{margin-left:10px;font-size:.95em}}
@media print{header,footer,.noprint,.ad{display:none}}</style></head><body><header><a href="/"><b>BillableCalc</b></a><nav><a href="/#tools">Tools</a><a href="/#guides">Guides</a><a href="/templates.html">Templates</a><a href="/#apps">Apps</a></nav></header>
<main><h1>Free Invoice Generator</h1><p class="noprint">Fill in the fields, then press Print / Save as PDF. Everything stays in your browser.</p>
<div class="card"><div class="noprint"><label>Your name / business</label><input id="from" value="Your Business">
<label>Bill to</label><input id="to" value="Client Name">
<label>Invoice number</label><input id="no" value="001">
<label>Description</label><input id="d" value="Consulting services">
<label>Hours</label><input id="q" type="number" value="10"><label>Rate</label><input id="r" type="number" value="50">
<label>Tax (%)</label><input id="t" type="number" value="0"><button onclick="render()">Update</button> <button onclick="window.print()">Print / Save as PDF</button></div>
<div id="inv"></div></div><div class="ad"><!-- Paste AdSense code here once approved --></div></main>
<footer>&copy; 2026 BillableCalc &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms &amp; Refunds</a> &middot; klachev.vitali@gmail.com</footer>
<script>function v(i){return document.getElementById(i).value}
function render(){var s=v('q')*v('r'),t=s*v('t')/100;document.getElementById('inv').innerHTML='<h2>INVOICE #'+v('no').replace(/</g,'')+'</h2><p><b>From:</b> '+esc(v('from'))+'<br><b>To:</b> '+esc(v('to'))+'<br><b>Date:</b> '+new Date().toLocaleDateString()+'</p><hr><p>'+esc(v('d'))+': '+v('q')+' x '+v('r')+' = '+s.toFixed(2)+'</p><p>Tax: '+t.toFixed(2)+'</p><div class="out">Total: '+(s+t).toFixed(2)+'</div>'}
function esc(x){return x.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}render()</script></body></html>
